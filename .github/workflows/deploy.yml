name: Deploy to GitHub Pages

on:
  # main ブランチへ push すると自動でビルド＆公開されます。
  push:
    branches: [main]
  # GitHub の Actions 画面から手動実行もできます。
  workflow_dispatch:

# GitHub Pages への公開に必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らないように直列化（公開の取りこぼし防止）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro 7 は Node.js 22.12.0 以上が必要（既定の20ではビルドが失敗する）。
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
